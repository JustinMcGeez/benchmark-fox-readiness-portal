# Apply database migrations to PRODUCTION — MANUAL, APPROVAL-GATED.
#
# There is intentionally NO push trigger: production is never auto-migrated.
# This runs only via workflow_dispatch, AND the `production` GitHub Environment
# must be configured with required reviewers so the job pauses for a human to
# approve before any `supabase db push` touches the production database.
# (Configure: repo Settings → Environments → production → Required reviewers.)
#
# See docs/deployment.md for the full release/migration runbook.
name: Migrate production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'migrate-production' to confirm you intend to migrate PRODUCTION"
        required: true
        type: string

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # The approval gate: this environment must require reviewers in repo settings.
    environment: production
    steps:
      - name: Validate confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "migrate-production" ]; then
            echo "::error::Confirmation phrase did not match 'migrate-production' — aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}"

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
        run: supabase db push
