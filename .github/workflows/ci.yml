# CI — typecheck, official-data validation, build, unit tests, e2e smoke.
# Deploy lives separately in deploy.yml (do not merge the two).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: scripts/import-sp800-171.ts runs directly via `node` and
      # relies on native TypeScript type-stripping (matches local dev).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate official data sources
        run: npm run build:data

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

  # Dependency vulnerability gate — production dependencies only (the ones that
  # ship to the browser). Fails the build on HIGH or CRITICAL advisories; lower
  # severities are reported by Dependabot (see .github/dependabot.yml) and tracked
  # in docs/deployment.md rather than blocking PRs.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  # Secret scan — gitleaks over the full git history so a committed credential
  # fails the build. (For a GitHub *organization* account this action also needs a
  # GITLEAKS_LICENSE secret; a personal/public repo does not — see the env note.)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit, not just the tip

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # required ONLY for GitHub org accounts

  # RLS policy tests — boot the local Supabase stack (Postgres + Auth + PostgREST),
  # apply all migrations + seed, then run the cross-tenant RLS suite as real
  # authenticated users. A policy regression fails the build. Separate job so the
  # Docker-based stack does not slow the main typecheck/build/unit/e2e gate.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Supabase local stack (applies migrations + seed)
        run: supabase start

      - name: Export local Supabase URL + keys for the harness
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: RLS policy tests
        run: npm run test:rls

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop
