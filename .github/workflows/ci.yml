# CI — typecheck, official-data validation, build, unit tests, e2e smoke.
# Deploy lives separately in deploy.yml (do not merge the two).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: scripts/import-sp800-171.ts runs directly via `node` and
      # relies on native TypeScript type-stripping (matches local dev).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate official data sources
        run: npm run build:data

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
