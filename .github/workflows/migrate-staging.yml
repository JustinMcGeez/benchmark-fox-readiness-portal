# Apply database migrations to STAGING on merge to main.
#
# Flow (see docs/deployment.md): migrations are committed under supabase/migrations
# and pushed to the staging Supabase project automatically when they land on main.
# Production is NEVER auto-migrated — that is a separate, manually-approved workflow
# (migrate-production.yml).
#
# This job no-ops safely until the staging secrets are provisioned, so it never
# blocks merges before the staging project exists.
name: Migrate staging

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate-staging.yml'
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - name: Check staging secrets are configured
        id: guard
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging Supabase secrets not set — skipping db push (provision SUPABASE_ACCESS_TOKEN + SUPABASE_STAGING_PROJECT_REF to enable)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.configured == 'true'
        with:
          version: latest

      - name: Link staging project
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}"

      - name: Push migrations to staging
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: supabase db push
